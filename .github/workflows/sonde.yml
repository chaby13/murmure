name: Sonde modèles de traduction
on:
  push:
    branches: [sonde-traduction]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Copie des modèles Opus-MT pour les essais
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          for pair in en-fr fr-en; do
            base="https://huggingface.co/Xenova/opus-mt-$pair/resolve/main"
            for f in onnx/encoder_model_quantized.onnx onnx/decoder_model_merged_quantized.onnx source.spm target.spm vocab.json config.json generation_config.json README.md; do
              curl -sSL --retry 4 -o "out/$pair-$(basename $f)" "$base/$f"
            done
            curl -sSL -o "out/$pair-MODEL_README.md" "https://huggingface.co/Helsinki-NLP/opus-mt-$pair/raw/main/README.md"
          done
          ls -la out
          gh release delete modeles-traduction -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create modeles-traduction -R "$GITHUB_REPOSITORY" out/* --prerelease --target "$GITHUB_SHA" \
            --title "Modèles de traduction (essais)" --notes "Copie des modèles Opus-MT ONNX (Xenova) pour les essais."
