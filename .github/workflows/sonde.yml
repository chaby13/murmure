name: Sonde modèles de traduction
on:
  push:
    branches: [sonde-traduction]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Tailles des modèles
        run: |
          for m in Xenova/opus-mt-en-fr Xenova/opus-mt-fr-en; do
            echo "== $m"
            curl -s "https://huggingface.co/api/models/$m/tree/main/onnx" | python3 -c "import sys,json;[print(f\"{x.get('size',0)/1048576:8.1f} Mo  {x['path']}\") for x in json.load(sys.stdin)]"
            curl -s "https://huggingface.co/api/models/$m/tree/main" | python3 -c "import sys,json;[print(f\"{x.get('size',0)/1048576:8.1f} Mo  {x['path']}\") for x in json.load(sys.stdin)]"
          done
          echo "== Mozilla"
          for pair in enfr fren; do
            curl -s "https://api.github.com/repos/mozilla/firefox-translations-models/contents/models/prod/$pair" | python3 -c "import sys,json;d=json.load(sys.stdin);[print(f\"{x.get('size',0)/1048576:8.1f} Mo  {x['path']}\") for x in (d if isinstance(d,list) else [])]" || true
            curl -s "https://api.github.com/repos/mozilla/firefox-translations-models/contents/models/tiny/$pair" | python3 -c "import sys,json;d=json.load(sys.stdin);[print(f\"{x.get('size',0)/1048576:8.1f} Mo  {x['path']}\") for x in (d if isinstance(d,list) else [])]" || true
          done
          curl -s "https://api.github.com/repos/mozilla/firefox-translations-models/contents/models" | python3 -c "import sys,json;d=json.load(sys.stdin);print([x['name'] for x in d] if isinstance(d,list) else d)"
