name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: |
          tool/fetch_pdfium.sh
          PDFIUM_PATH=.pdfium/lib/libpdfium.so flutter test

      - name: Compilation de l'APK
        run: flutter build apk --release

      - name: Vérification confidentialité (aucune permission Internet)
        run: |
          manifest=$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "Manifeste fusionné : $manifest"
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::La permission INTERNET est présente dans le build de production."
            exit 1
          fi
          echo "OK : aucune permission INTERNET."

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: murmure-apk
          path: build/app/outputs/flutter-apk/app-release.apk
