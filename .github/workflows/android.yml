name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: |
          tool/fetch_pdfium.sh
          PDFIUM_PATH=.pdfium/lib/libpdfium.so flutter test

      - name: Compilation de l'APK
        run: flutter build apk --release

      - name: Vérification confidentialité (aucune permission Internet)
        run: |
          manifest=$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "Manifeste fusionné : $manifest"
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::La permission INTERNET est présente dans le build de production."
            exit 1
          fi
          echo "OK : aucune permission INTERNET."

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: murmure-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Lien direct vers le dernier APK (sans zip) pour l'installer sur un téléphone.
      - name: Mettre à jour la version de test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk murmure.apk
          gh release delete apk-test --yes --cleanup-tag || true
          gh release create apk-test murmure.apk --prerelease --target "$GITHUB_SHA" \
            --title "Murmure, version de test" \
            --notes "APK de test fabriqué automatiquement depuis le commit $GITHUB_SHA."
