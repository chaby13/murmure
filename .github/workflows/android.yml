name: Android et Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: |
          tool/fetch_pdfium.sh
          PDFIUM_PATH=.pdfium/lib/libpdfium.so flutter test

      - name: Modèle de transcription et voix
        run: |
          tool/fetch_whisper_model.sh
          tool/fetch_voices.sh

      # NDK demandé par whisper_ggml pour compiler whisper.cpp.
      - name: NDK Android
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;29.0.13113456" > /dev/null

      - name: Compilation de l'APK
        run: flutter build apk --release

      - name: Vérification confidentialité (aucune permission Internet)
        run: |
          manifest=$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "Manifeste fusionné : $manifest"
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::La permission INTERNET est présente dans le build de production."
            exit 1
          fi
          echo "OK : aucune permission INTERNET."

      # APK léger (arm64 seulement : téléphones de 2017 et après) à envoyer par mail.
      - name: Compilation de l'APK léger
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: murmure-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Lien direct vers le dernier APK (sans zip) pour l'installer sur un téléphone.
      - name: Mettre à jour la version de test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk murmure.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk murmure-leger.apk
          ls -lh murmure.apk murmure-leger.apk
          gh release delete apk-test --yes --cleanup-tag || true
          gh release create apk-test murmure.apk murmure-leger.apk --prerelease --target "$GITHUB_SHA" \
            --title "Murmure, version de test" \
            --notes "APK de test fabriqué automatiquement depuis le commit $GITHUB_SHA."

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Modèle de transcription et voix
        shell: bash
        run: |
          tool/fetch_whisper_model.sh
          tool/fetch_voices.sh

      - name: Compilation Windows
        run: |
          flutter pub get
          flutter build windows --release

      - name: Préparation du dossier à télécharger
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          # Bibliothèques Visual C++ incluses pour les PC qui ne les ont pas.
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR/System32/$dll" $out
          }
          Compress-Archive -Path "$out/*" -DestinationPath murmure-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: murmure-windows
          path: murmure-windows.zip

      - name: Mettre à jour la version de test Windows
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-test --yes --cleanup-tag || true
          gh release create windows-test murmure-windows.zip --prerelease --target "$GITHUB_SHA" \
            --title "Murmure pour Windows, version de test" \
            --notes "Dézipper puis lancer murmure.exe. Fabriqué depuis le commit $GITHUB_SHA."
