name: murmure
description: "Murmure : lisez, écoutez, traduisez. En toute liberté. Application locale de Chabane DEV."
publish_to: 'none'

# Source unique du numéro de version affiché dans À propos (lu via package_info_plus).
version: 0.1.0+1

environment:
  sdk: ^3.13.5

# Règle de confidentialité : toute nouvelle dépendance doit être auditée contre
# les communications réseau avant d'être ajoutée (voir docs/CADRAGE_V1.md).
dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.0.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^2.10.0
  pdfrx_engine: ^0.8.0
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/
